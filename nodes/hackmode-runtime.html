<script type="text/javascript">
    RED.nodes.registerType('hackmode-runtime', {
        category: 'config',
        color: '#2c3e50',
        defaults: {
            name: { value: '' },
            lisp: { value: 'sbcl' },
            hackmodeHome: { value: '', required: true },
            timeoutMs: { value: 60000 }
        },
        label: function () {
            return this.name || 'hackmode-runtime';
        }
    });
</script>

<script type="text/html" data-template-name="hackmode-runtime">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name">
    </div>
    <div class="form-row">
        <label for="node-config-input-lisp"><i class="fa fa-terminal"></i> Lisp</label>
        <input type="text" id="node-config-input-lisp" placeholder="sbcl">
    </div>
    <div class="form-row">
        <label for="node-config-input-hackmodeHome"><i class="fa fa-folder"></i> hackmode checkout</label>
        <input type="text" id="node-config-input-hackmodeHome" placeholder="/path/to/hackmode/source">
        <div class="form-tips">The runtime loads ASDF system :hackmode from this tree (source/ subtree of the hackmode monorepo).</div>
    </div>
    <div class="form-row">
        <label for="node-config-input-timeoutMs"><i class="fa fa-clock-o"></i> Timeout (ms)</label>
        <input type="number" id="node-config-input-timeoutMs" placeholder="60000">
    </div>
</script>
